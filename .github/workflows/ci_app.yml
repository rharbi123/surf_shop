name: CI/CD Application WaveCraft

on:
  push:
    branches: [ main ]

jobs:

  # =====================================================
  # ETAPE 1 : VALIDATION (C18)
  # =====================================================
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérification des fichiers essentiels
        run: |
          test -f backend/index.php
          test -f backend/config.php
          test -d backend/api

  # =====================================================
  # ETAPE 2 : TESTS AUTOMATISES (C18)
  # =====================================================
  tests:
    needs: validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: surfshop_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql

      - name: Installation des dépendances Composer
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Import de la structure de la base de données
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot surfshop_db < "backend/sql/surf shop.sql"

      - name: Exécution des tests PHPUnit
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: surfshop_db
          DB_USER: root
          DB_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: php vendor/bin/phpunit tests/TestApplication.php --testdox

  # =====================================================
  # ETAPE 3 : PACKAGING (C19)
  # =====================================================
  packaging:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Création de l'archive de l'application
        run: |
          mkdir -p package
          cp -r backend package/backend
          rm -rf package/backend/tests
          rm -rf package/backend/.env
          zip -r wavecraft_app.zip package

      - name: Sauvegarde de l'archive
        uses: actions/upload-artifact@v4
        with:
          name: wavecraft-app-package
          path: wavecraft_app.zip
          retention-days: 30

  # =====================================================
  # ETAPE 4 : DEPLOIEMENT (C19)
  # =====================================================
  deploiement:
    needs: packaging
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: surfshop_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Récupération de l'archive
        uses: actions/download-artifact@v4
        with:
          name: wavecraft-app-package

      - name: Extraction de l'archive
        run: unzip wavecraft_app.zip

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql

      - name: Installation des dépendances
        working-directory: package/backend
        run: composer install --no-interaction --prefer-dist

      - name: Import de la structure de la base de données
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot surfshop_db < "backend/sql/surf shop.sql"

      - name: Démarrage du serveur de test
        working-directory: package/backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: surfshop_db
          DB_USER: root
          DB_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          php -S localhost:8000 index.php &
          sleep 2
          curl -f http://localhost:8000/api/planches || exit 1